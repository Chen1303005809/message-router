[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kefu"
version = "0.1.0"
description = "企业微信客户问题流转机器人"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.20",
    "python-socks[asyncio]>=2.7,<3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "wecom-aibot-python-sdk>=1.0.2,<1.1",
]

[project.scripts]
kefu-bootstrap = "kefu.bootstrap:main"
kefu-worker = "kefu.worker:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
