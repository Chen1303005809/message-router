<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>问题协作业务流程图</title>
  <style>
    :root {
      color-scheme: light dark;
      --page:#f3f7fc; --surface:#ffffff; --ink:#15243a; --muted:#60718a; --line:#c6d3e3;
      --consult:#1876d2; --consult-soft:#e8f2ff; --hub:#7354c9; --hub-soft:#f1edff;
      --dev:#138169; --dev-soft:#e7f7f1; --total:#cf7022; --total-soft:#fff2e6;
      --danger:#c8484e; --danger-soft:#fff0f1;
    }
    @media (prefers-color-scheme: dark) { :root {
      --page:#101725; --surface:#182334; --ink:#eaf0fb; --muted:#adbbd0; --line:#3b4c65;
      --consult:#68b8ff; --consult-soft:#183756; --hub:#b79cff; --hub-soft:#35285d;
      --dev:#65d5b6; --dev-soft:#183e39; --total:#ffad69; --total-soft:#4f3623;
      --danger:#ff9498; --danger-soft:#502a31;
    }}
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    main { width:min(1480px,calc(100% - 32px)); margin:0 auto; padding:28px 0 42px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; margin:0 4px 18px; }
    h1 { margin:0; font-size:clamp(24px,3vw,36px); letter-spacing:-.035em; }
    p { margin:7px 0 0; color:var(--muted); font-size:14px; }
    .tag { color:var(--hub); font-size:12px; font-weight:750; letter-spacing:.08em; }
    .canvas { overflow-x:auto; border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:0 16px 42px color-mix(in srgb,var(--ink) 10%,transparent); }
    svg { display:block; min-width:1060px; width:100%; height:auto; fill:var(--ink); }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .t-title { font-size:17px; font-weight:750; } .t-label { font-size:13px; font-weight:720; } .t-small { font-size:12px; } .t-xs { font-size:10.5px; }
    .box { fill:var(--surface); stroke:var(--line); stroke-width:1.2; }
    .consult { fill:var(--consult-soft); stroke:var(--consult); stroke-width:1.45; }
    .hub { fill:var(--hub-soft); stroke:var(--hub); stroke-width:1.45; }
    .dev { fill:var(--dev-soft); stroke:var(--dev); stroke-width:1.45; }
    .total { fill:var(--total-soft); stroke:var(--total); stroke-width:1.45; }
    .danger { fill:var(--danger-soft); stroke:var(--danger); stroke-width:1.45; }
    .dashed { stroke-dasharray:6 5; } .dotted { stroke-dasharray:2.5 5; }
    .a-consult { fill:none; stroke:var(--consult); stroke-width:1.85; marker-end:url(#a-consult); }
    .a-hub { fill:none; stroke:var(--hub); stroke-width:1.85; marker-end:url(#a-hub); }
    .a-dev { fill:none; stroke:var(--dev); stroke-width:1.85; marker-end:url(#a-dev); }
    .a-total { fill:none; stroke:var(--total); stroke-width:1.85; marker-end:url(#a-total); }
    footer { margin:14px 4px 0; color:var(--muted); font-size:12px; }
    @media (max-width:720px) { main { width:calc(100% - 18px); padding-top:16px; } header { display:block; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="tag">01 · 业务流程图</div>
        <h1>问题从发布、认领到解决的全过程</h1>
        <p>研发在自己的内部群主动 @机器人认领时，系统才建立事件。</p>
      </div>
      <p>认领时记住研发对接人和所在群，后续消息固定回到这个研发群</p>
    </header>

    <div class="canvas">
      <svg viewBox="0 0 1280 810" role="img" aria-labelledby="title desc">
        <title id="title">由研发认领并建立事件的跨部门业务流程</title>
        <desc id="desc">咨询在没有机器人的总群发布问题。多个研发群中的任一成员都可以回到自己的内部群主动艾特机器人认领。机器人此时建立事件，记住认领人和认领所在的研发群，随后把事件通知唯一咨询群。咨询和研发后续都通过引用机器人消息互动，机器人始终把消息转回认领时绑定的研发群。</desc>
        <defs>
          <marker id="a-consult" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--consult)"/></marker>
          <marker id="a-hub" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--hub)"/></marker>
          <marker id="a-dev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--dev)"/></marker>
          <marker id="a-total" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--total)"/></marker>
        </defs>

        <!-- Three communication spaces -->
        <rect x="18" y="18" width="1244" height="128" rx="16" class="total" opacity=".62"/>
        <rect x="18" y="168" width="292" height="616" rx="16" class="consult" opacity=".24"/>
        <rect x="329" y="168" width="320" height="616" rx="16" class="hub" opacity=".20"/>
        <rect x="668" y="168" width="594" height="616" rx="16" class="dev" opacity=".22"/>

        <text x="42" y="47" class="t-title" fill="var(--total)">总群 · 咨询 + 全体研发 · 无机器人</text>
        <text x="42" y="69" class="t-small" fill="var(--muted)">只发布原问题和最终答案；机器人看不到这里的消息。</text>
        <text x="40" y="198" class="t-title" fill="var(--consult)">唯一的咨询内部群</text>
        <text x="351" y="198" class="t-title" fill="var(--hub)">机器人 / 事件中心</text>
        <text x="690" y="198" class="t-title" fill="var(--dev)">多个研发内部群</text>

        <!-- Total group -->
        <rect x="72" y="82" width="386" height="47" rx="10" class="total"/>
        <text x="94" y="109" class="t-label">1 · 咨询 @目标研发，发布问题</text>
        <rect x="850" y="82" width="352" height="47" rx="10" class="total"/>
        <text x="872" y="109" class="t-label">8 · 研发引用原问题，只回复最终答案</text>
        <g>
          <circle cx="620" cy="105" r="23" class="danger"/>
          <path d="M609 99h22v14h-22z M613 106h2 M620 106h2 M627 106h2 M602 86l36 38" fill="none" stroke="var(--danger)" stroke-width="1.8" stroke-linecap="round"/>
          <text x="657" y="101" class="t-label" fill="var(--danger)">机器人不在总群</text>
          <text x="657" y="121" class="t-xs" fill="var(--muted)">不能自动发现问题或建立事件</text>
        </g>

        <!-- Multiple dev groups; the claiming group becomes the destination. -->
        <rect x="700" y="222" width="150" height="56" rx="11" class="box"/>
        <text x="775" y="246" text-anchor="middle" class="t-label">研发一组群</text>
        <text x="775" y="264" text-anchor="middle" class="t-xs" fill="var(--muted)">未认领</text>
        <rect x="870" y="222" width="180" height="56" rx="11" class="dev"/>
        <text x="960" y="246" text-anchor="middle" class="t-label">研发二组群</text>
        <text x="960" y="264" text-anchor="middle" class="t-xs" fill="var(--dev)">本例由这里认领</text>
        <rect x="1070" y="222" width="150" height="56" rx="11" class="box"/>
        <text x="1145" y="246" text-anchor="middle" class="t-label">研发三组群</text>
        <text x="1145" y="264" text-anchor="middle" class="t-xs" fill="var(--muted)">未认领</text>

        <path d="M265 129 C390 162 790 164 960 222" class="a-total dashed"/>
        <text x="520" y="159" class="t-xs" fill="var(--total)">研发人员看到问题后，回到自己的研发群认领</text>
        <path d="M960 278 V310" class="a-dev"/>

        <!-- Claim creates the event. -->
        <rect x="760" y="310" width="420" height="105" rx="13" class="dev"/>
        <text x="784" y="340" class="t-label">2 · 研发 B 在研发二组群主动认领</text>
        <text x="784" y="365" class="t-small" fill="var(--dev)">@机器人：这个问题由我们组处理</text>
        <text x="784" y="389" class="t-small" fill="var(--muted)">同时带上总群问题的必要信息</text>
        <text x="784" y="406" class="t-xs" fill="var(--muted)">其他研发群无需响应，机器人也不会广播。</text>

        <rect x="360" y="300" width="270" height="125" rx="13" class="hub"/>
        <text x="383" y="330" class="t-label">3 · 此时才建立事件</text>
        <text x="383" y="355" class="t-small" fill="var(--hub)">生成事件编号：#7Q2K</text>
        <text x="383" y="379" class="t-small" fill="var(--muted)">记住认领人：研发 B</text>
        <text x="383" y="403" class="t-small" fill="var(--muted)">记住认领位置：研发二组群</text>

        <path d="M760 362 H630" class="a-dev"/>
        <text x="672" y="346" class="t-xs" fill="var(--dev)">主动 @机器人</text>

        <rect x="45" y="300" width="255" height="125" rx="13" class="consult"/>
        <text x="68" y="330" class="t-label">4 · 咨询群收到认领通知</text>
        <text x="68" y="355" class="t-small" fill="var(--muted)">机器人引用研发 B 的认领消息</text>
        <text x="68" y="379" class="t-small" fill="var(--muted)">通知中带有 〔事件 #7Q2K〕</text>
        <text x="68" y="403" class="t-xs" fill="var(--consult)">咨询可直接引用这条消息继续沟通</text>
        <path d="M360 362 H300" class="a-hub"/>

        <!-- Consultation replies; robot uses the stored group. -->
        <rect x="45" y="495" width="255" height="115" rx="13" class="consult"/>
        <text x="68" y="525" class="t-label">5 · 咨询补充或追问</text>
        <text x="68" y="550" class="t-small" fill="var(--consult)">必须引用带事件编号的机器人消息</text>
        <text x="68" y="574" class="t-small" fill="var(--muted)">本次发送者成为咨询侧最新对接人</text>
        <text x="68" y="596" class="t-xs" fill="var(--muted)">不需要选择研发群。</text>

        <rect x="360" y="495" width="270" height="115" rx="13" class="hub"/>
        <text x="383" y="525" class="t-label">机器人根据引用找到事件</text>
        <text x="383" y="550" class="t-small" fill="var(--hub)">看到事件 #7Q2K</text>
        <text x="383" y="574" class="t-small" fill="var(--muted)">查到它已绑定研发二组群</text>
        <text x="383" y="596" class="t-xs" fill="var(--hub)">后续不再重新判断该发给哪个研发群。</text>
        <path d="M300 552 H360" class="a-consult"/>

        <rect x="690" y="485" width="260" height="125" rx="13" class="dev"/>
        <text x="713" y="515" class="t-label">6 · 只发到研发二组群</text>
        <text x="713" y="540" class="t-small" fill="var(--muted)">机器人引用咨询刚发的消息</text>
        <text x="713" y="564" class="t-small" fill="var(--muted)">并继续带上事件编号</text>
        <text x="713" y="588" class="t-xs" fill="var(--dev)">研发一组、三组不会收到这条信息</text>
        <path d="M630 552 H690" class="a-hub"/>

        <rect x="980" y="485" width="250" height="125" rx="13" class="box dotted"/>
        <text x="1003" y="515" class="t-label">研发二组内部协同</text>
        <text x="1003" y="541" class="t-small" fill="var(--muted)">排查 · 修复 · 联调 · 多人讨论</text>
        <text x="1003" y="570" class="t-xs" fill="var(--danger)">不 @机器人：不转发、不进入事件记录</text>
        <text x="1003" y="594" class="t-xs" fill="var(--muted)">过程不会出现在总群或咨询群。</text>
        <path d="M950 547 H980" class="a-dev"/>

        <!-- Formal reply returns to the only consultation group. -->
        <rect x="760" y="652" width="420" height="110" rx="13" class="dev"/>
        <text x="784" y="682" class="t-label">7 · 研发正式回复</text>
        <text x="784" y="707" class="t-small" fill="var(--dev)">引用机器人的事件消息并 @机器人</text>
        <text x="784" y="731" class="t-small" fill="var(--muted)">机器人记录本次回复人，并把结果送回咨询群</text>
        <text x="784" y="750" class="t-xs" fill="var(--muted)">回复、补充、追问都沿同一事件反复进行。</text>
        <path d="M1105 610 V652" class="a-dev"/>

        <rect x="360" y="662" width="270" height="90" rx="13" class="hub"/>
        <text x="383" y="691" class="t-label">机器人完成引用接力</text>
        <text x="383" y="716" class="t-small" fill="var(--muted)">根据事件编号记录回复人</text>
        <text x="383" y="739" class="t-xs" fill="var(--hub)">引用研发回复，发送到唯一咨询群</text>
        <path d="M760 707 H630" class="a-dev"/>

        <rect x="45" y="662" width="255" height="90" rx="13" class="consult"/>
        <text x="68" y="691" class="t-label">咨询群收到进展或结果</text>
        <text x="68" y="716" class="t-small" fill="var(--muted)">需要继续时，再引用机器人消息</text>
        <text x="68" y="739" class="t-xs" fill="var(--consult)">无需创建临时群，也不会丢失上下文。</text>
        <path d="M360 707 H300" class="a-hub"/>
        <path d="M172 662 V610" class="a-consult dashed"/>

        <!-- Manual final answer returns to the total group. -->
        <path d="M1180 707 H1240 V105 H1202" class="a-total dashed"/>
      </svg>
    </div>
    <footer>核心规则：哪个研发群先由成员主动 @机器人认领，事件就绑定哪个研发群；后续机器人只向这个群转发。</footer>
  </main>
</body>
</html>
